name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Atualiza todos os dias às 03:00 UTC.

  workflow_dispatch: # Permite executar manualmente pela aba Actions.

  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Executa quando o workflow for alterado.

jobs:
  generate-streak:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permite salvar o SVG gerado no repositório.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: update streak stats" || exit 0
          git push
